name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-uv publishes no floating major tag after v7, so this pins a release in major 10.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Test
        run: make test
